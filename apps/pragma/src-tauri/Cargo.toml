[package]
name = "pragma"
version = "0.0.0"
description = "Pragma desktop app"
authors = ["Pragma"]
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "pragma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
pragma-constants = { path = "../../../packages/constants" }
serde = { workspace = true }
serde_json = { workspace = true }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
