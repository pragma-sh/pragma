[package]
name = "pragma"
version = "0.0.0"
description = "Pragma desktop app"
authors = ["Pragma"]
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "pragma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
pragma-constants = { path = "../../../packages/constants" }
pragma-protocol = { path = "../../../crates/pragma-protocol" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
base64 = "0.22"
log = "0.4"
opener = "0.7"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls",
] }
rusqlite = { version = "0.32", features = ["bundled"] }
scopeguard = "1"
tauri = { version = "2.11.2", features = ["unstable", "devtools"] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-notification = "2"
xcap = { version = "0.6", features = ["image"] }
tauri-plugin-log = "2"
tiny_http = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6.15"

[dev-dependencies]
tempfile = "3"
