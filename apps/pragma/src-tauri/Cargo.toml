[package]
name = "pragma"
version = "1.0.0"
description = "Pragma desktop app"
authors = ["Pragma"]
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.77.2"
publish = false

[lib]
name = "pragma_lib"
# Desktop-only: `main.rs` links the rlib, and Pragma ships no Tauri mobile target
# (the phone client is `apps/pragma-go`). The Tauri template's `cdylib` is for
# mobile, and it cannot be produced here: `pragma-core` pulls in `excalidraw-image`
# -> `deno_core` -> `v8`, whose prebuilt objects use TLS relocations that Linux
# rejects in a shared object (`R_X86_64_TPOFF32 ... cannot be used with -shared`).
crate-type = ["staticlib", "rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
pragma-constants = { path = "../../../packages/constants" }
pragma-client = { path = "../../../crates/pragma-client" }
pragma-core = { path = "../../../crates/pragma-core" }
pragma-protocol = { path = "../../../crates/pragma-protocol" }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
base64 = "0.22"
include_dir = "0.7"
log = "0.4"
minisign = "0.9"
opener = "0.7"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls",
] }
rusqlite = { workspace = true }
scopeguard = "1"
semver = "1"
tauri = { version = "2.11.2", features = [
  "unstable",
  "devtools",
  "macos-private-api",
  "protocol-asset",
] }
tauri-plugin-decorum = "1.1.1"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-notification = "2"
xcap = { version = "0.6", features = ["image"] }
tauri-plugin-log = "2"
tiny_http = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }
pragma-platform = { path = "../../../crates/pragma-platform" }
sha2 = { workspace = true }
tar = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6.15"
window-vibrancy = "0.6"

[dev-dependencies]
tempfile = "3"

# Deep links only reach a *running* app on Linux and Windows through the
# single-instance plugin; its `deep-link` feature re-emits the forwarded URL
# through `on_open_url`, so those platforms take the same code path macOS
# gets from the OS. macOS must NOT load it: launchd already routes URLs to
# the running app, and a second instance there would be the bug, not the fix.
[target.'cfg(any(target_os = "linux", windows))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
