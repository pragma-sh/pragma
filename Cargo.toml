[workspace]
resolver = "2"
members = [
  "apps/pragma/src-tauri",
  "crates/pragma-cli",
  "crates/pragma-client",
  "crates/pragma-core",
  "crates/pragma-gateway",
  "crates/pragma-platform",
  "crates/pragma-protocol",
  "crates/pragma-server",
  "packages/bench",
  "packages/constants",
]

# Shared dependency versions for every crate in the workspace.
# Crates opt in with `serde = { workspace = true }`.
[workspace.dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
netstat2 = "0.11"
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

# Consistent lint policy across the whole Rust workspace.
# Crates opt in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pragmatic allows so pedantic stays useful without being noisy.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Optimised for iteration speed, not for shipping: used by `bun run bench --fast`.
# The release profile runs full LTO with one codegen unit, which turns a one-line
# change to pragma-server into a ~48s relink — fine for a bundle built once, fatal
# for a loop that rebuilds after every edit. Dropping LTO and raising codegen units
# gives up some absolute speed in exchange for a rebuild measured in seconds.
#
# Numbers from this profile are NOT comparable to release numbers, so it never
# records a baseline (see --fast in packages/bench/src/index.ts). Structural
# counters are unaffected by optimisation level, and those are the only gated
# class, so an audit still means something under it.
[profile.bench-fast]
inherits = "release"
lto = false
codegen-units = 16
opt-level = 2
strip = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
