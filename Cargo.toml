[workspace]
resolver = "2"
members = [
  "apps/pragma/src-tauri",
  "crates/pragma-cli",
  "crates/pragma-client",
  "crates/pragma-core",
  "crates/pragma-gateway",
  "crates/pragma-protocol",
  "crates/pragma-server",
  "packages/constants",
]

# Shared dependency versions for every crate in the workspace.
# Crates opt in with `serde = { workspace = true }`.
[workspace.dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

# Consistent lint policy across the whole Rust workspace.
# Crates opt in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pragmatic allows so pedantic stays useful without being noisy.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
