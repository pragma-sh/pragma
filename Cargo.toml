[workspace]
resolver = "2"
members = [
  "apps/pragma/src-tauri",
  "crates/pragma-cli",
  "crates/pragma-client",
  "crates/pragma-core",
  "crates/pragma-gateway",
  "crates/pragma-platform",
  "crates/pragma-protocol",
  "crates/pragma-server",
  "packages/bench",
  "packages/constants",
]

# Shared dependency versions for every crate in the workspace.
# Crates opt in with `serde = { workspace = true }`.
[workspace.dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
excalidraw-image = "0.2"
regex = "1"
netstat2 = "0.11"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls",
] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = "1"
uuid = { version = "1", features = ["v4", "serde"] }

# Consistent lint policy across the whole Rust workspace.
# Crates opt in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pragmatic allows so pedantic stays useful without being noisy.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# `pragma-server` hashes its own executable at start-up (the hello `buildId`),
# and a debug server is >100 MB. Unoptimized `sha2` makes that take seconds on
# every dev start; optimized it is a fraction of one.
[profile.dev.package.sha2]
opt-level = 3
