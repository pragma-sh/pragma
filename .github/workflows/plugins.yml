name: Publish official plugins

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Publish one plugin or refresh official lock
        required: true
        type: choice
        options: [publish, refresh-lock]
      dist-tag:
        description: >-
          npm dist-tag. `latest` is what a stable release needs; `alpha` leaves
          `latest` where it is, so a prerelease never becomes the default install.
        required: true
        default: latest
        type: choice
        options: [latest, alpha]
      package:
        description: npm package to publish
        required: false
        type: choice
        options:
          - "@pragma-sh/claude-code-plugin"
          - "@pragma-sh/codex-plugin"
          - "@pragma-sh/cursor-plugin"
          - "@pragma-sh/grok-plugin"
          - "@pragma-sh/github-copilot-cli-plugin"
          - "@pragma-sh/junie-plugin"
          - "@pragma-sh/kimi-plugin"
          - "@pragma-sh/opencode-plugin"
          - "@pragma-sh/pi-plugin"
          - "@pragma-sh/prime-agent-plugin"
      ref:
        description: >-
          Git ref to publish from — the plugin's release tag when `release.yml`
          dispatches this. Empty publishes the ref the workflow was run on.
        required: false
        default: ""

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  publish:
    if: inputs.operation == 'publish'
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.package.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@latest
      - run: bun install --frozen-lockfile
      - name: Resolve reviewed package
        id: package
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          bun -e 'const list = await Bun.file("packages/plugin-registry/official.json").json(); if (!list.packages.includes(process.env.PACKAGE)) throw new Error("package is not official"); const name = process.env.PACKAGE; console.log(`dir=packages/${name.split("/").at(-1)}`); console.log(`name=${name}`)' >> "$GITHUB_OUTPUT"
      - run: bunx turbo run build --filter="${{ steps.package.outputs.name }}"
      - run: npm pack "./${{ steps.package.outputs.dir }}" --dry-run
      - name: Publish with provenance
        run: |
          npm publish "./${{ steps.package.outputs.dir }}" \
            --access public --tag "${{ inputs.dist-tag }}" --provenance

  refresh-lock:
    if: always() && (inputs.operation == 'refresh-lock' || needs.publish.result == 'success')
    needs: [publish]
    runs-on: ubuntu-latest
    # A release dispatches one run per plugin, all at once, and every one ends
    # here writing the same branch. GitHub keeps one run going and only the
    # newest pending one, cancelling the rest — which is exactly right: the lock
    # resolves every package from npm, so the last refresh sees every publish.
    concurrency:
      group: official-plugin-lock
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Wait for npm propagation
        if: needs.publish.result == 'success'
        run: sleep 20
      - run: bun run --filter @pragma-sh/plugin-registry lock
      - run: bun run --filter @pragma-sh/plugin-registry validate
      - uses: peter-evans/create-pull-request@v7
        # The action pushes with git, which would run Husky's pre-push hook: a full
        # typecheck + `cargo check` that needs GTK headers this runner lacks.
        env:
          HUSKY: "0"
        with:
          # GITHUB_TOKEN cannot open PRs here (the org disallows it) and a PR it opens
          # triggers no CI, so use the same token Release Please does.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          add-paths: packages/plugin-registry/official.lock.json
          branch: automation/official-plugin-lock
          commit-message: "chore(plugins): refresh official lock"
          title: "chore(plugins): refresh official lock"
          body: Generated from exact npm release metadata and cached `pragma-plugin.json` manifests.
