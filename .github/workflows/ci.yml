# macOS and Windows CI.
#
# Everything that can run on Linux — commitlint, the TypeScript checks, the
# Rust checks, and the Linux app build — lives in `.rwx/ci.yml` and runs on RWX.
# RWX only runs Linux containers, so the two remaining desktop targets stay
# here. Keep the two files in sync when a check is added or removed.
# PRs and `main` compile with `--no-bundle`. Git tags run a signed bundle.
name: CI (macOS & Windows)

on:
  push:
    branches: [main]
    tags:
      - "*"
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-windows:
    name: Rust on Windows (clippy, test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # No apt step and no GTK/WebKit: the Windows webview is WebView2, which
      # ships with the OS on Windows 11 and with the Edge runtime on Windows 10.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - name: Stage daemon sidecar
        # `shell: bash` selects the Git Bash that ships with the Windows runner,
        # which is what the staging script is written against.
        shell: bash
        run: bash apps/pragma/src-tauri/scripts/stage-daemon-sidecar.sh
      - name: Lint (clippy)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Unit tests (cargo test)
        # PRAGMA_TEST_PTY opts in to the test that spawns a real shell on a real
        # pseudo-terminal (ConPTY on Windows). It is off by default because a
        # sandboxed local executor may not be allowed to allocate one.
        run: cargo test --workspace --all-features
        env:
          PRAGMA_TEST_PTY: "1"

  build:
    name: Build app (${{ matrix.os }})
    needs: [rust-windows]
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - run: bun install --frozen-lockfile
      - name: Build Tauri app (compile only, no bundling)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: bun run --filter pragma tauri build --no-bundle
      - name: Bundle signed release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run --filter pragma tauri build
