# macOS and Windows CI.
#
# Everything that can run on Linux — commitlint, the TypeScript checks, the
# Rust checks, and the Linux app build — lives in `.rwx/ci.yml` and runs on RWX.
# RWX only runs Linux containers, so the two remaining desktop targets stay
# here. Keep the two files in sync when a check is added or removed.
# PRs and `main` compile with `--no-bundle`. Git tags run a signed bundle.
name: CI (macOS & Windows)

on:
  push:
    branches: [main]
    tags:
      - "*"
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-windows:
    name: Rust on Windows (clippy, test)
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # No apt step and no GTK/WebKit: the Windows webview is WebView2, which
      # ships with the OS on Windows 11 and with the Edge runtime on Windows 10.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - name: Stage daemon sidecar
        # `shell: bash` selects the Git Bash that ships with the Windows runner,
        # which is what the staging script is written against.
        shell: bash
        run: bash apps/pragma/src-tauri/scripts/stage-daemon-sidecar.sh
      - name: Lint (clippy)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Rust tests (including native menu regression)
        # PRAGMA_TEST_PTY opts in to the test that spawns a real shell on a real
        # pseudo-terminal (ConPTY on Windows). It is off by default because a
        # sandboxed local executor may not be allowed to allocate one.
        run: cargo test --workspace --all-features
        env:
          PRAGMA_TEST_PTY: "1"

  # Starts the real pragma-server.exe on a fresh data directory, as the runner's
  # admin account *and* as a newly created standard user, restarts it over the
  # socket a forced kill leaves behind, and checks another account cannot connect.
  # Nothing else in CI or the release ever starts the server on Windows. Runs on
  # stable and on the release's pinned toolchain — keep that in step with
  # `toolchain:` in release.yml.
  #
  # Known limit: it does NOT reproduce #212. That failure needs Windows build
  # 26300+; the hosted images are 26100 (Server 2025) and 26200 (Windows 11 ARM),
  # where the pre-fix server passes this check in every configuration.
  windows-server-smoke:
    name: Windows server smoke (${{ matrix.runner }}, rust ${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
        toolchain: [stable, 1.96.0]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: server-smoke-${{ matrix.toolchain }}
      - name: Build pragma-server
        run: cargo build -p pragma-server
      - name: Smoke-test the server (admin and standard user)
        shell: pwsh
        run: ./scripts/windows-server-smoke.ps1 -Server target/debug/pragma-server.exe -StandardUser

  build:
    name: Build app (${{ matrix.platform }})
    needs: [rust-windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            platform: macos
          - runner: windows-latest
            platform: windows-x86_64
          - runner: windows-11-arm
            platform: windows-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Rebuild V8 native archive after cache restore
        if: ${{ runner.os == 'macOS' }}
        # rust-cache prunes the archive in target/release/gn_out but can retain
        # V8's build-script fingerprint. Force that script to download it again.
        run: cargo clean --package v8 --release
      - run: bun install --frozen-lockfile
      - name: Build Tauri app (compile only, no bundling)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: bun run --filter pragma tauri build --no-bundle
      - name: Bundle signed release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run --filter pragma tauri build
