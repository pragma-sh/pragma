name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      desktop-created: ${{ steps.release.outputs['apps/pragma--release_created'] }}
      desktop-body: ${{ steps.release.outputs['apps/pragma--body'] }}
      desktop-sha: ${{ steps.release.outputs['apps/pragma--sha'] }}
      desktop-tag: ${{ steps.release.outputs['apps/pragma--tag_name'] }}
      desktop-version: ${{ steps.release.outputs['apps/pragma--version'] }}
      go-created: ${{ steps.release.outputs['apps/pragma-go--release_created'] }}
      go-tag: ${{ steps.release.outputs['apps/pragma-go--tag_name'] }}
      go-version: ${{ steps.release.outputs['apps/pragma-go--version'] }}
      releases-created: ${{ steps.release.outputs.releases_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  desktop-build:
    needs: release-please
    if: ${{ needs.release-please.outputs.desktop-created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin-aarch64
            source: target/release/bundle/dmg/*.dmg
            extension: dmg
          - runner: macos-15-intel
            platform: darwin-x86_64
            source: target/release/bundle/dmg/*.dmg
            extension: dmg
          - runner: ubuntu-24.04
            platform: linux-x86_64
            formats: deb rpm
            bundles: --bundles deb,rpm
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
            formats: deb rpm
            bundles: --bundles deb,rpm
          - runner: windows-latest
            platform: windows-x86_64
            source: target/release/bundle/nsis/*-setup.exe
            extension: exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.desktop-tag }}
      - name: Install Linux dependencies
        if: ${{ startsWith(matrix.platform, 'linux-') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev libgtk-3-dev libpipewire-0.3-dev libgbm-dev libclang-dev build-essential file
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - name: Require update signing keys
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: test -n "$PRIVATE_KEY" && test -n "$PUBLIC_KEY"
      - name: Build signed desktop bundle
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PRAGMA_UPDATE_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        # Linux restricts the bundle list to what this job uploads. `tauri.conf.json`
        # also targets AppImage, whose linuxdeploy step needs FUSE and fails on the
        # ubuntu-24.04 runners — and nothing downstream ships an AppImage: the matrix
        # collects deb/rpm and the release manifest never names one.
        #
        # No `--` before the flags: bun already forwards trailing args to the script
        # verbatim, and tauri treats a literal `--` as "pass the rest to cargo", which
        # dies with `unexpected argument '--bundles' found`.
        run: bun run --filter pragma tauri build ${{ matrix.bundles }}
      - name: Normalize installer name
        shell: bash
        env:
          SOURCE_GLOB: ${{ matrix.source }}
          DESTINATION: Pragma-${{ needs.release-please.outputs.desktop-version }}-${{ matrix.platform }}.${{ matrix.extension }}
          FORMATS: ${{ matrix.formats }}
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.release-please.outputs.desktop-version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ "$PLATFORM" == linux-* ]]; then
            mkdir release-asset
            for format in $FORMATS; do
              files=( target/release/bundle/$format/*.$format )
              if [ "${#files[@]}" -ne 1 ] || [ ! -f "${files[0]}" ]; then
                printf 'Expected one %s installer, found %s\n' "$format" "${#files[@]}" >&2
                exit 1
              fi
              destination="release-asset/Pragma-$VERSION-$PLATFORM-$format.$format"
              cp "${files[0]}" "$destination"
              bunx tauri signer sign "$destination"
            done
            exit 0
          fi
          files=( $SOURCE_GLOB )
          if [ "${#files[@]}" -ne 1 ] || [ ! -f "${files[0]}" ]; then
            printf 'Expected one installer for %s, found %s\n' "$SOURCE_GLOB" "${#files[@]}" >&2
            exit 1
          fi
          mkdir release-asset
          cp "${files[0]}" "release-asset/$DESTINATION"
          bunx tauri signer sign "release-asset/$DESTINATION"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: release-asset/*
          if-no-files-found: error

  publish-desktop:
    needs: [release-please, desktop-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.desktop-tag }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Build UI overlay
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          bun run --filter pragma build
          tar -cf "release-assets/Pragma-${{ needs.release-please.outputs.desktop-version }}-ui.tar" -C apps/pragma/dist .
          bunx tauri signer sign "release-assets/Pragma-${{ needs.release-please.outputs.desktop-version }}-ui.tar"
      - name: Find previous desktop release
        id: previous
        env:
          CURRENT_TAG: ${{ needs.release-please.outputs.desktop-tag }}
        run: |
          previous="$(git tag --list 'pragma-v*' --sort=-version:refname | grep -Fvx "$CURRENT_TAG" | head -1 || true)"
          printf 'tag=%s\n' "$previous" >> "$GITHUB_OUTPUT"
      - name: Generate release manifest
        env:
          PREVIOUS_RELEASE_TAG: ${{ steps.previous.outputs.tag }}
          RELEASE_ASSETS_DIR: release-assets
          RELEASE_NOTES: ${{ needs.release-please.outputs.desktop-body }}
          RELEASE_SHA: ${{ needs.release-please.outputs.desktop-sha }}
          RELEASE_TAG: ${{ needs.release-please.outputs.desktop-tag }}
          # Signing release.json needs the same key as the overlay above; without it
          # `tauri signer sign` dies with "Unable to find the private key".
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          bun scripts/generate-release-manifest.ts
          bunx tauri signer sign release-assets/release.json
      - name: Upload installers and metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.desktop-tag }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber
      # Only now does this release carry installers, so only now may it become
      # the one `/releases/latest` — and the website's Download button — resolve to.
      - name: Mark the desktop release Latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bun scripts/pin-latest-desktop-release.ts

  # Every component release Release Please publishes takes GitHub's "Latest"
  # flag, so a run that releases only plugins or packages would leave the
  # Download button on a plugin. Hand the flag back to the newest desktop release
  # that has installers. A desktop run does this itself in `publish-desktop`,
  # once its upload has landed.
  pin-latest-desktop:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases-created == 'true' && needs.release-please.outputs.desktop-created != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Mark the newest desktop release Latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bun scripts/pin-latest-desktop-release.ts

  # Pragma Go ships to Android outside the Play Store as a sideloadable APK attached
  # to its own `pragma-go-v*` release, which is what Obtainium watches (see the README).
  # EAS builds it: the `preview` profile is the store-shaped APK build, and EAS holds the
  # signing keystore, so every APK is signed with the same key and upgrades in place.
  android-apk:
    needs: release-please
    if: ${{ needs.release-please.outputs.go-created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.go-tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build the APK on EAS
        working-directory: apps/pragma-go
        env:
          # The profile sets this on the worker; eas-cli also resolves the app config
          # locally, and the fingerprint must match the one the worker computes.
          PRAGMA_STORE_BUILD: "1"
          VERSION: ${{ needs.release-please.outputs.go-version }}
        run: |
          eas build --platform android --profile preview --non-interactive --wait --json > "$RUNNER_TEMP/build.json"
          url="$(jq -r '.[0].artifacts.buildUrl // .[0].artifacts.applicationArchiveUrl' "$RUNNER_TEMP/build.json")"
          test -n "$url" && test "$url" != null
          mkdir -p "$RUNNER_TEMP/apk"
          curl -fsSL "$url" -o "$RUNNER_TEMP/apk/Pragma-Go-$VERSION-android.apk"
      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.go-tag }}
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP"/apk/*.apk --clobber

  # Pragma Go ships to iOS through TestFlight. EAS builds the `production` profile on
  # its own macOS workers (so this job needs no macOS runner) and signs it with the
  # distribution certificate and profile it already stores; `eas submit` then uploads
  # the build with the App Store Connect API key stored on EAS. Both credentials must
  # already exist on EAS — `--non-interactive` cannot create them (see CONTRIBUTING.md).
  ios-testflight:
    needs: release-please
    if: ${{ needs.release-please.outputs.go-created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.go-tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build on EAS and submit to TestFlight
        working-directory: apps/pragma-go
        env:
          # Same reason as the APK job: the locally-resolved config must fingerprint
          # identically to the worker's, or OTA updates never reach this build.
          PRAGMA_STORE_BUILD: "1"
        # Build and submit are separate steps, not `--auto-submit`, so a rejected
        # upload fails this job instead of only showing up on the EAS dashboard.
        run: |
          eas build --platform ios --profile production --non-interactive --wait --json > "$RUNNER_TEMP/build.json"
          id="$(jq -r '.[0].id' "$RUNNER_TEMP/build.json")"
          test -n "$id" && test "$id" != null
          eas submit --platform ios --profile production --id "$id" --non-interactive

  publish-packages:
    needs: release-please
    if: ${{ needs.release-please.outputs.desktop-created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm authenticates this job by OIDC: the id-token is both the credential
      # (each package trusts pragma-sh/pragma + release.yml) and what signs
      # provenance. There is no npm token here on purpose — see CONTRIBUTING.md.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.desktop-tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@latest
      - run: bun install --frozen-lockfile
      - name: Build the packages that ship a bundle
        run: bunx turbo run build --filter="./packages/*"
      - name: Publish every public package with provenance
        # Dependency order, so a fresh scope never has a dangling reference.
        # A version that is already on the registry is skipped rather than
        # failing the job, which is what makes a re-run safe.
        run: bun scripts/publish-packages.ts --publish
