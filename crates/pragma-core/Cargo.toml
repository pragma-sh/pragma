[package]
name = "pragma-core"
version = "1.0.1"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
description = "Pure Rust host-side business logic for Pragma."

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
chrono = { workspace = true }
excalidraw-image = { workspace = true }
ignore = "0.4"
notify-debouncer-full = "0.7"
pragma-constants = { path = "../../packages/constants" }
pragma-platform = { path = "../pragma-platform" }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
uuid = { workspace = true }

[dev-dependencies]
filetime = "0.2"
tempfile = "3"
