[package]
name = "pragma-core"
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
description = "Pure Rust host-side business logic for Pragma."

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
ignore = "0.4"
notify-debouncer-full = "0.7"
pragma-constants = { path = "../../packages/constants" }
pragma-platform = { path = "../pragma-platform" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"
