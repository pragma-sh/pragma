[package]
name = "pragma-computer"
version = "1.3.4"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
description = "Native computer-use backends for Pragma (accessibility, capture, synthetic input) and the `pragma-computer` helper process that pragma-server supervises."

[lints]
workspace = true

[[bin]]
name = "pragma-computer"
path = "src/bin/pragma-computer.rs"
required-features = ["native"]

[features]
default = ["native"]
# The platform backends and capture. `pragma-server` turns this off: it needs
# only the protocol and the fake backend, never AppKit or a capture stack.
native = [
  "dep:objc2-screen-capture-kit",
  "dep:block2",
  "dep:windows",
  "dep:image",
  "dep:xcap",
  "dep:libc",
  "dep:objc2",
  "dep:objc2-app-kit",
  "dep:objc2-application-services",
  "dep:objc2-core-foundation",
  "dep:objc2-core-graphics",
  "dep:objc2-foundation",
]

[dependencies]
base64 = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
pragma-constants = { path = "../../packages/constants" }
pragma-core = { path = "../pragma-core" }
pragma-platform = { path = "../pragma-platform" }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
xcap = { version = "0.6", features = ["image"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6", optional = true }
libc = { version = "0.2", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = [
  "std",
  "NSRunningApplication",
  "NSWorkspace",
] }
objc2-application-services = { version = "0.3", optional = true, default-features = false, features = [
  "std",
  "HIServices",
  "AXError",
  "AXUIElement",
  "AXValue",
  "AXValueConstants",
  "libc",
] }
objc2-core-foundation = { version = "0.3", optional = true, default-features = false, features = [
  "std",
  "CFArray",
  "CFData",
  "CFBase",
  "CFCGTypes",
  "CFDictionary",
  "CFNumber",
  "CFRunLoop",
  "CFString",
] }
objc2-core-graphics = { version = "0.3", optional = true, default-features = false, features = [
  "std",
  "CGEvent",
  "CGImage",
  "CGDataProvider",
  "CGBitmapContext",
  "CGContext",
  "CGColorSpace",
  "CGEventSource",
  "CGEventTypes",
  "CGRemoteOperation",
  "CGWindow",
] }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = [
  "std",
  "NSArray",
  "NSString",
  "NSURL",
  "NSProcessInfo",
] }
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = [
  "std",
  "libc",
  "SCShareableContent",
  "SCScreenshotManager",
  "SCStream",
  "block2",
  "objc2-core-foundation",
  "objc2-core-graphics",
], optional = true }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", optional = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_Ole",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"
