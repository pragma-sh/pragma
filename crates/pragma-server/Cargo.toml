[package]
name = "pragma-server"
version = "0.0.0"
edition = "2021"
publish = false
description = "Persistent host-side server for Pragma terminal sessions and workspace state."

[lints]
workspace = true

[dependencies]
anyhow = "1"
chrono = { workspace = true }
daemonize = "0.5"
portable-pty = "0.8"
pragma-constants = { path = "../../packages/constants" }
pragma-core = { path = "../pragma-core" }
pragma-protocol = { path = "../pragma-protocol" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"
