[package]
name = "pragma-server"
version = "1.7.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
description = "Persistent host-side server for Pragma terminal sessions and workspace state."

[lints]
workspace = true

[dependencies]
anyhow = "1"
base64 = { workspace = true }
chrono = { workspace = true }
netstat2 = { workspace = true }
portable-pty = "0.8"
pragma-computer = { path = "../pragma-computer", default-features = false }
pragma-constants = { path = "../../packages/constants" }
pragma-core = { path = "../pragma-core" }
pragma-platform = { path = "../pragma-platform" }
pragma-protocol = { path = "../pragma-protocol" }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
uuid = { workspace = true }

[target.'cfg(unix)'.dependencies]
daemonize = "0.5"

[dev-dependencies]
pragma-platform = { path = "../pragma-platform", features = ["test-support"] }
tempfile = "3"

# Builds the broken listening socket the listener tests recover from; std has no
# way to bind, connect, and then listen on one socket.
[target.'cfg(target_os = "macos")'.dev-dependencies]
socket2 = "0.6"
