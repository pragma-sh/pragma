[package]
name = "pragma-server"
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
description = "Persistent host-side server for Pragma terminal sessions and workspace state."

[lints]
workspace = true

[dependencies]
anyhow = "1"
base64 = { workspace = true }
chrono = { workspace = true }
netstat2 = { workspace = true }
portable-pty = "0.8"
pragma-constants = { path = "../../packages/constants" }
pragma-core = { path = "../pragma-core" }
pragma-platform = { path = "../pragma-platform" }
pragma-protocol = { path = "../pragma-protocol" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
uuid = { workspace = true }

[target.'cfg(unix)'.dependencies]
daemonize = "0.5"

[dev-dependencies]
pragma-platform = { path = "../pragma-platform" }
tempfile = "3"
