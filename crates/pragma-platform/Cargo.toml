[package]
name = "pragma-platform"
version = "1.3.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
description = "Operating-system primitives shared by every Pragma crate: local IPC transport, owner-only file permissions, process termination, shell resolution, and the dock/taskbar icon menu."

[lints]
workspace = true

[dependencies]
pragma-constants = { path = "../../packages/constants" }
sysinfo = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSApplication",
  "NSMenu",
  "NSMenuItem",
  "NSResponder",
] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

[target.'cfg(windows)'.dependencies]
uds_windows = "1.2"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_EnhancedStorage",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
] }

[dev-dependencies]
tempfile = "3"
