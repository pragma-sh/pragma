[package]
name = "pragma-cli"
version = "1.4.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
description = "Terminal control surface for Pragma: worktrees, tabs, splits, browser webviews, and agents."

[[bin]]
name = "pragma-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
pragma-constants = { path = "../../packages/constants" }
pragma-platform = { path = "../pragma-platform" }
pragma-protocol = { path = "../pragma-protocol" }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toon-format = "0.5"
uuid = { workspace = true }

# `agent run` keeps the supervisor alive through terminal-generated signals so
# it can report the child's real exit. Already in the workspace lock
# (crossterm); used with its safe API only.
[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"
