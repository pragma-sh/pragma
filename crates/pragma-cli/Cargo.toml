[package]
name = "pragma-cli"
version = "0.0.0"
edition = "2021"
publish = false
description = "CLI for Pragma host/client utilities and external agent status reporting."

[[bin]]
name = "pragma-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
pragma-constants = { path = "../../packages/constants" }
pragma-protocol = { path = "../pragma-protocol" }
serde_json = { workspace = true }
