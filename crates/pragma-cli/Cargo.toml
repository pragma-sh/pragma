[package]
name = "pragma-cli"
version = "0.0.0"
edition = "2021"
publish = false
description = "Terminal control surface for Pragma: worktrees, tabs, splits, browser webviews, and agents."

[[bin]]
name = "pragma-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
pragma-constants = { path = "../../packages/constants" }
pragma-protocol = { path = "../pragma-protocol" }
serde = { workspace = true }
serde_json = { workspace = true }
toon-format = "0.5"
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3"
