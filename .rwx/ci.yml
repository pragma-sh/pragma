# Linux CI for Pragma, running on RWX.
#
# RWX runs Linux containers only (`rwx/base` supports the `ubuntu:*` images and
# nothing else), so the macOS and Windows halves of CI stay on GitHub Actions in
# `.github/workflows/ci.yml`. Between the two files, all three target platforms
# are still covered on every push to `main` and every pull request.

on:
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
      branch: ${{ event.git.branch }}
      base-ref: main
      github-token: ""
      lint-commits: false
  github:
    push:
      if: ${{ event.git.branch == 'main' }}
      init:
        commit-sha: ${{ event.git.sha }}
        branch: ${{ event.git.branch }}
        base-ref: main
        github-token: ${{ github.token }}
        lint-commits: false
    pull_request:
      init:
        commit-sha: ${{ event.git.sha }}
        branch: ${{ event.git.branch }}
        base-ref: main
        github-token: ${{ github.token }}
        lint-commits: true

# Supersede in-flight runs for the same ref, matching the GitHub Actions
# `concurrency` block this file replaces.
concurrency-pools:
  - id: pragma-sh/pragma:ci-${{ init.branch }}
    capacity: 1
    on-overflow: cancel-running

base:
  image: ubuntu:24.04
  config: rwx/base 1.1.1

tasks:
  - key: code
    call: git/clone 2.0.8
    with:
      repository: https://github.com/pragma-sh/pragma.git
      ref: ${{ init.commit-sha }}

  # commitlint and the fallow audit both need real history to walk a range
  # against the base ref, so they share a clone with the `.git` directory
  # preserved. Keeping it separate leaves the `code` task above free of `.git`
  # churn, which caches far better.
  - key: code-with-history
    call: git/clone 2.0.8
    with:
      repository: https://github.com/pragma-sh/pragma.git
      ref: ${{ init.commit-sha }}
      preserve-git-dir: true
      fetch-full-depth: true

  - key: bun
    run: |
      sudo apt-get update
      sudo apt-get install -y unzip
      sudo apt-get clean
      sudo install -d -o "$(id -u)" -g "$(id -g)" "$BUN_INSTALL"
      curl -fsSL https://bun.sh/install | bash -s "bun-v$BUN_VERSION"
      echo "$BUN_INSTALL/bin" > $RWX_ENV/PATH
      echo "$BUN_INSTALL" > $RWX_ENV/BUN_INSTALL
      # $RWX_ENV only takes effect for downstream tasks, so verify by full path.
      "$BUN_INSTALL/bin/bun" --version
    env:
      # Keep in lockstep with `packageManager` in the root package.json.
      BUN_VERSION: 1.3.14
      BUN_INSTALL: /var/bun

  - key: rust
    call: rust-lang/install 1.0.8
    with:
      rust-version: 1.96.0

  - key: system-packages
    run: |
      sudo apt-get update
      sudo apt-get install -y \
        libwebkit2gtk-4.1-dev \
        libappindicator3-dev \
        librsvg2-dev \
        patchelf \
        libssl-dev \
        libxdo-dev \
        libgtk-3-dev \
        libpipewire-0.3-dev \
        libgbm-dev \
        libclang-dev \
        build-essential \
        file
      sudo apt-get clean

  - key: bun-install
    use: [code, bun]
    # `prepare: husky` would fail against a clone with no `.git` directory.
    env:
      HUSKY: "0"
    run: bun install --frozen-lockfile
    filter:
      - package.json
      - bun.lock
      - bunfig.toml
      - "**/package.json"
      - patches/**
    timeout: 20m

  - key: commitlint
    # `code-with-history` comes last so its `.git` directory wins the filesystem
    # merge over the history-less tree `bun-install` carries down from `code`.
    use: [bun-install, code-with-history]
    env:
      BASE_REF: ${{ init.base-ref }}
      HUSKY: "0"
    run: |
      git fetch --quiet origin "$BASE_REF"
      bunx commitlint --from "$(git merge-base FETCH_HEAD HEAD)" --to HEAD --verbose

  # Shared by every TypeScript check: the generated shared-constant types are an
  # input to lint, typecheck, and the test suites alike.
  - key: generate
    use: [code, bun-install]
    run: bun run generate
    timeout: 20m

  - key: lint
    use: generate
    run: bun run lint

  - key: format-check
    use: generate
    run: bun run format:check

  - key: typecheck
    use: generate
    run: bun run typecheck
    timeout: 20m
    runner:
      cpus: 4

  - key: gh
    call: github/install-cli 1.0.11

  # fallow's code-intelligence audit (dead code + complexity + duplication),
  # scoped to what this change touches. It diffs against the base ref, so it
  # needs real history — hence `code-with-history`, which comes last so its
  # `.git` directory wins the filesystem merge over the history-less tree
  # `generate` carries down from `code`. `generate` is a prerequisite in its own
  # right: fallow resolves imports statically, and the generated modules under
  # gitignored `src/generated/**` would otherwise look unresolved.
  - key: fallow
    use: [gh, generate, code-with-history]
    env:
      BASE_REF: ${{ init.base-ref }}
      BRANCH: ${{ init.branch }}
      GH_REPO: pragma-sh/pragma
      # Posting the sticky report needs a fine-grained GitHub token with `Pull
      # requests: read and write` on this repo, stored in the RWX default vault
      # as `fallow-comment-token`. `gh` picks `GH_TOKEN` up implicitly.
      GH_TOKEN:
        value: ${{ secrets.fallow-comment-token }}
        cache-key: excluded
    run: |
      # `--base` needs a resolvable ref. Fetch into the remote-tracking name
      # rather than `refs/heads/$BASE_REF`: on a push to main that branch is
      # checked out and git refuses to fetch into it.
      git fetch --quiet origin "$BASE_REF:refs/remotes/origin/$BASE_REF"

      status=0
      bunx fallow audit \
        --base "origin/$BASE_REF" \
        --gate new-only \
        --fail-on-issues \
        --format pr-comment-github \
        --output-file fallow-comment.md || status=$?
      cat fallow-comment.md

      # Post (or update) the sticky report on the PR this branch belongs to.
      # fallow prefixes the body with `<!-- fallow-id: fallow-results -->`, so
      # matching on that marker keeps one comment instead of one per run.
      #
      # Best-effort: the audit's own pass/fail ($status) is the real gate, so a
      # missing/expired token here must not fail the task and mask a clean
      # audit. A push to `main` has no PR and skips this entirely.
      pr=""
      if [ -n "${GH_TOKEN:-}" ]; then
        pr="$(gh pr list --repo "$GH_REPO" --head "$BRANCH" --state open \
          --json number --jq '.[0].number // empty')" || pr=""
      else
        echo "fallow-comment-token unset — skipping the PR comment." >&2
      fi
      if [ -n "$pr" ]; then
        existing="$(gh api "repos/$GH_REPO/issues/$pr/comments" --paginate \
          --jq 'map(select(.body | startswith("<!-- fallow-id: fallow-results -->"))) | .[0].id // empty')" || existing=""
        if [ -n "$existing" ]; then
          gh api --method PATCH "repos/$GH_REPO/issues/comments/$existing" \
            -F body=@fallow-comment.md > /dev/null || true
        else
          gh api --method POST "repos/$GH_REPO/issues/$pr/comments" \
            -F body=@fallow-comment.md > /dev/null || true
        fi
      fi

      exit "$status"

  # `readGrokAcp` (packages/grok-plugin) streams `grok agent stdio` through an
  # `awk` watcher that touches a sentinel file the moment both JSON-RPC
  # responses arrive. mawk — the `awk` on a stock ubuntu image — block-buffers
  # its stdin, so it sees nothing until EOF and the drain always burns its full
  # 6s poll bound; gawk streams and finishes in ~0.1s. GitHub's runner image
  # ships gawk as the default `awk`, which is why this never surfaced there.
  # TODO: make readGrokAcp resilient to a buffering awk — Debian/Ubuntu users
  # hit the same 6s stall in the real app, not just in CI.
  - key: gawk
    run: |
      sudo apt-get update
      sudo apt-get install -y gawk
      sudo apt-get clean
      awk --version | head -1

  - key: test
    use: [generate, gawk]
    run: bun run test
    timeout: 20m
    runner:
      cpus: 4

  - key: rust-fmt
    use: [code, rust]
    run: cargo fmt --all -- --check

  # tauri-build validates that the externalBin resource exists, so the pragma
  # crate won't even compile (clippy/test) without the staged binary.
  - key: sidecars
    use: [code, bun-install, rust, system-packages]
    run: bash apps/pragma/src-tauri/scripts/stage-daemon-sidecar.sh
    timeout: 45m
    runner:
      cpus: 16

  - key: clippy
    use: sidecars
    run: cargo clippy --workspace --all-targets --all-features -- -D warnings
    timeout: 45m
    runner:
      cpus: 16

  - key: cargo-test
    use: sidecars
    # PRAGMA_TEST_PTY opts in to the test that spawns a real shell on a real
    # pseudo-terminal. It is off by default because a sandboxed local executor
    # may not be allowed to allocate one.
    env:
      PRAGMA_TEST_PTY: "1"
    run: cargo test --workspace --all-features
    timeout: 45m
    runner:
      cpus: 16

  - key: build-linux
    use: [generate, rust, system-packages]
    after: [lint, format-check, typecheck, test, clippy, cargo-test]
    run: bun run --filter pragma tauri build --no-bundle
    timeout: 60m
    runner:
      cpus: 16
